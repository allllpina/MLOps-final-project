[project]
name = "mlops-final-project"
version = "0.1.0"
description = "Final project on KodeKloud 100 Days of MLOps Challenge"
readme = "README.md"
authors = [
    { name = "alllpina", email = "danilcrystal8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.89",
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
]


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
managed = true
package = false
